<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="hero">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix illustration">
      <a class="more-inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>

    <main class="centered-main-page-element">
      <section id="topSectionForAddingElementToList">
        <label class="form-label" for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text">
          <button class="add">Add</button>
        </div>
      </section>

      <section>
        <h3 class="section-title">Todo</h3>
        <ul id="incompleteTasks" class="list">
          <li class="list__item">
            <input class="checkbox" type="checkbox">
            <label class="task">Pay Bills</label>
            <input type="text" class="task">
            <button class="edit">Edit</button>
            <button class="delete">
              <img class="icon" src="./remove.svg" alt="" aria-hidden="true">
            </button>
          </li>
          <li class="list__item editMode">
            <input class="checkbox" type="checkbox">
            <label class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task">
            <button class="edit">Save</button>
            <button class="delete">
              <img class="icon" src="./remove.svg" alt="" aria-hidden="true">
            </button>
          </li>
        </ul>
      </section>

      <section>
        <h3 class="section-title">Completed</h3>
        <ul id="completed-tasks" class="list">
          <li class="list__item">
            <input class="checkbox" type="checkbox" checked>
            <label class="task">See the Doctor</label>
            <input type="text" class="task">
            <button class="edit">Edit</button>
            <button class="delete">
              <img class="icon" src="./remove.svg" alt="" aria-hidden="true">
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
