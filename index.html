<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="promo">
      <img class="promo__image" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix illustration">
      <a class="promo__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>

    <main class="todo">
      <section id="topSectionForAddingElementToList" class="todo__form">
        <label class="todo__label" for="new-task">Add Item</label>
        <div class="todo__controls">
          <input id="new-task" class="todo__input" type="text">
          <button class="todo__btn todo__btn--add">Add</button>
        </div>
      </section>

      <section class="todo__section">
        <h3 class="todo__heading">Todo</h3>
        <ul id="incompleteTasks" class="todo__list todo__list--incomplete">
          <li class="todo__item">
            <input class="todo__checkbox" type="checkbox">
            <label class="todo__label">Pay Bills</label>
            <input class="todo__input" type="text">
            <button class="todo__btn todo__btn--edit">Edit</button>
            <button class="todo__btn todo__btn--delete" aria-label="Delete">
              <img class="todo__icon" src="./remove.svg" alt="" aria-hidden="true">
            </button>
          </li>
          <li class="todo__item todo__item--editing">
            <input class="todo__checkbox" type="checkbox">
            <label class="todo__label">Go Shopping</label>
            <input class="todo__input" type="text" value="Go Shopping">
            <button class="todo__btn todo__btn--edit">Save</button>
            <button class="todo__btn todo__btn--delete" aria-label="Delete">
              <img class="todo__icon" src="./remove.svg" alt="" aria-hidden="true">
            </button>
          </li>
        </ul>
      </section>

      <section class="todo__section">
        <h3 class="todo__heading">Completed</h3>
        <ul id="completed-tasks" class="todo__list todo__list--completed">
          <li class="todo__item">
            <input class="todo__checkbox" type="checkbox" checked>
            <label class="todo__label">See the Doctor</label>
            <input class="todo__input" type="text">
            <button class="todo__btn todo__btn--edit">Edit</button>
            <button class="todo__btn todo__btn--delete" aria-label="Delete">
              <img class="todo__icon" src="./remove.svg" alt="" aria-hidden="true">
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
